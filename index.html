<!DOCTYPE html>

<head>
<script id="gpt6-luna-shim">
/* gpt-6-luna: modelo por defecto con temperatura=1 (actualización sep-2026).
   Adapta las peticiones a la API de OpenAI para la familia gpt-6:
   temperature=1, max_tokens -> max_completion_tokens (con margen para razonamiento)
   y reintento automático si la API rechaza algún parámetro. */
(function(){
  var NEW='gpt-6-luna', OLD='gpt-4o-mini';
  try{
    if(!localStorage.getItem('__gpt6_luna_mig_v1')){
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i), v=localStorage.getItem(k);
        if(v===OLD||v==='"'+OLD+'"'){ localStorage.setItem(k, v.replace(OLD,NEW)); continue; }
        if(v && v.length<20000 && v.charAt(0)==='{' && v.indexOf(OLD)>=0){
          try{ var o=JSON.parse(v), ch=false;
            for(var p in o){ if(o[p]===OLD){ o[p]=NEW; ch=true; } }
            if(ch) localStorage.setItem(k, JSON.stringify(o));
          }catch(e){}
        }
      }
      localStorage.setItem('__gpt6_luna_mig_v1','1');
    }
  }catch(e){}
  var of=window.fetch; if(!of) return;
  function adapt(url,b){
    if(!b || typeof b.model!=='string' || !/^gpt-6/.test(b.model)) return false;
    b.temperature=1;
    ['top_p','frequency_penalty','presence_penalty','logit_bias','logprobs','top_logprobs'].forEach(function(p){ delete b[p]; });
    if(/chat\/completions/.test(url) && b.max_tokens!=null){
      if(b.max_completion_tokens==null) b.max_completion_tokens=Math.min(128000, (+b.max_tokens||0)+6000);
      delete b.max_tokens;
    }
    return true;
  }
  window.fetch=function(input,init){
    var url=typeof input==='string'?input:(input&&input.url)||'';
    if(!/api\.openai\.com\/v1\/(chat\/completions|responses)/.test(url) || !init || typeof init.body!=='string') return of.apply(this,arguments);
    var b; try{ b=JSON.parse(init.body); }catch(e){ return of.apply(this,arguments); }
    if(!adapt(url,b)) return of.apply(this,arguments);
    var self=this, tries=0;
    function go(){
      var ini=Object.assign({},init,{body:JSON.stringify(b)});
      return of.call(self,input,ini).then(function(r){
        if(r.status!==400 || tries>=3) return r;
        return r.clone().json().then(function(j){
          var err=(j&&j.error)||{}, p=err.param, msg=String(err.message||'');
          if(!p){ var m=msg.match(/'([a-z_]+)'/); if(m) p=m[1]; }
          if(p && b.hasOwnProperty(p) && /unsupported|not supported|does not support|only the default/i.test(msg)){
            delete b[p]; tries++; return go();
          }
          return r;
        },function(){ return r; });
      });
    }
    return go();
  };
})();
</script>

function initRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  const r=new SR();r.lang=LANG_VOICES[LG]||'es-ES';r.continuous=false;r.interimResults=true;
  r.onstart=()=>{isL=true;document.getElementById('bmc').classList.add('rec');document.getElementById('cin').classList.add('lis');setVB('listening',T('vstt').replace('🎙 ','').split(' ')[0]||'listening')};
  r.onresult=e=>{const t=Array.from(e.results).map(x=>x[0].transcript).join('');document.getElementById('cin').value=t;ares(document.getElementById('cin'))};
  r.onend=()=>{isL=false;document.getElementById('bmc').classList.remove('rec');document.getElementById('cin').classList.remove('lis');setVB('idle','voz');const v=document.getElementById('cin').value.trim();if(v)sendMsg()};
  r.onerror=e=>{isL=false;document.getElementById('bmc').classList.remove('rec');setVB('idle','voz');if(e.error!=='no-speech')toast(e.error,'err')};
  return r;
}

function speak(txt,cb){
  if(!ST.tts||!window.speechSynthesis){cb?.();return}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  const locale=LANG_VOICES[LG]||'es-ES';
  u.lang=locale;u.rate=0.91;
  const vs=window.speechSynthesis.getVoices(),v=vs.find(x=>x.lang.startsWith(locale.split('-')[0])&&x.localService)||vs.find(x=>x.lang.startsWith(locale.split('-')[0]));if(v)u.voice=v;
  u.onstart=()=>setVB('speaking',T('vtts').replace('🔊 ',''));
  u.onend=()=>{setVB('idle','voz');cb?.()};u.onerror=()=>{setVB('idle','voz');cb?.()};
  window.speechSynthesis.speak(u);
}

/* ═══ API ═══ */
async function callAI(messages,sys,max=900,json=false){
  const k=getKey();if(!k)throw new Error(T('ek'));
  const m=getModel(),body={model:m,max_tokens:max,messages:[{role:'system',content:sys},...messages]};
  if(json&&!m.startsWith('o1'))body.response_format={type:'json_object'};
  const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||'API error '+r.status)}
  const d=await r.json();return d.choices?.[0]?.message?.content||'';
}

/* ═══ RADAR ═══ */
function buildRadar(comps){
  const N=comps.length,cx=150,cy=140,R=105,rm=18;
  const ang=comps.map((_,i)=>((2*Math.PI*i)/N)-Math.PI/2);
  const pt=(v,i)=>{const r=rm+(v/10)*(R-rm);return[cx+r*Math.cos(ang[i]),cy+r*Math.sin(ang[i])]};
  const ptR=(r,i)=>[cx+r*Math.cos(ang[i]),cy+r*Math.sin(ang[i])];
  const rings=[2,4,6,8,10].map(v=>{const r2=rm+(v/10)*(R-rm);return`<polygon points="${ang.map((_,i)=>ptR(r2,i).join(',')).join(' ')}" fill="none" stroke="var(--brd)" stroke-width="1"/>`}).join('');
  const spokes=ang.map((_,i)=>{const[x2,y2]=ptR(R,i);return`<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--brd)" stroke-width="1"/>`}).join('');
  const data=comps.map((_,i)=>pt(comps[i].score,i).join(',')).join(' ');
  const labels=comps.map((cm,i)=>{const[x,y]=ptR(R+18,i),a=x<cx-5?'end':x>cx+5?'start':'middle';return`<text x="${x}" y="${y}" text-anchor="${a}" font-family="Inter,sans-serif" font-size="9.5" fill="var(--t2)" dominant-baseline="middle">${(cm[LG]||cm.es||cm.en||'').split(' ')[0]}</text>`}).join('');
  const dots=comps.map((cm,i)=>{const[x,y]=pt(cm.score,i);return`<circle cx="${x}" cy="${y}" r="4" fill="${cm.c}" opacity=".9"/>`}).join('');
  return`<svg style="max-width:300px;width:100%" viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg">${rings}${spokes}<polygon points="${data}" fill="rgba(58,184,224,.13)" stroke="var(--pl)" stroke-width="2"/>${dots}${labels}</svg>`;
}

/* ═══ PROGRESS ═══ */
async function renderProg(){
  let sessions=[];try{sessions=await getS()}catch(e){}
  sessions.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const n=sessions.length,avg=n?sessions.reduce((s,x)=>s+x.score,0)/n:0,best=n?Math.max(...sessions.map(x=>x.score)):0,totalMin=n?Math.round(sessions.reduce((s,x)=>s+(x.elapsed||0),0)/60):0;
  document.getElementById('pstats').innerHTML=`<div class="psc"><div class="psn">${n}</div><div class="psl">${T('tS')}</div></div><div class="psc"><div class="psn">${n?avg.toFixed(1):'—'}</div><div class="psl">${T('aS')}</div></div><div class="psc"><div class="psn">${n?best.toFixed(1):'—'}</div><div class="psl">${T('bS')}</div></div><div class="psc"><div class="psn">${totalMin}m</div><div class="psl">${T('tT')}</div></div>`;
  if(n>0){
    const ac={};COMPS.forEach(cm=>{const vs=sessions.map(s=>s.competencias?.[cm.id]?.puntuacion||0);ac[cm.id]={score:vs.reduce((a,v)=>a+v,0)/vs.length}});
    const cs=COMPS.map(cm=>({...cm,score:ac[cm.id].score,comment:''}));
    document.getElementById('rsvg').innerHTML=buildRadar(cs);
    document.getElementById('rlg').innerHTML=cs.map(c=>`<div class="rli"><div class="rld" style="background:${c.c}"></div>${LG==='es'?c.es:c.en} <strong>${c.score.toFixed(1)}</strong></div>`).join('');
  } else {document.getElementById('rsvg').innerHTML=`<p style="color:var(--t3);font-size:12px;text-align:center;padding:20px">${T('noS')}</p>`;document.getElementById('rlg').innerHTML=''}
  renderEvoChart(sessions);
  if(!n){document.getElementById('histlist').innerHTML=`<div class="hempty">${T('noS')}</div>`;return}
  document.getElementById('histlist').innerHTML=sessions.slice(0,15).map(s=>{
    const mi={practice:'📚',exam:'📝',tutor:'🎓'}[s.mode]||'📚',d=new Date(s.date).toLocaleDateString({'es':'es-ES','ca':'ca-ES','en':'en-GB','pt':'pt-PT','fr':'fr-FR','de':'de-DE'}[LG]||'es-ES');
    return`<div class="hit2"><div class="hiav">${s.patientAvatar||'🧑'}</div><div class="him"><div class="hin">${s.patientName||'—'}</div><div class="hims">${mi} ${s.specialty||''} · ${s.difficulty||''} · ${d}</div></div><div class="his"><div class="hisn" style="color:${CC(s.calificacion)};-webkit-text-fill-color:${CC(s.calificacion)}">${(s.score||0).toFixed(1)}</div><div class="hisl">${s.calificacion||'—'}</div></div></div>`;
  }).join('');
}
function renderEvoChart(sessions){
  const svg=document.getElementById('csvg');svg.innerHTML='';
  if(sessions.length<2){svg.innerHTML=`<text x="50%" y="50%" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="var(--t3)">${T('noS')}</text>`;return}
  const data=[...sessions].reverse().slice(-20),W=svg.clientWidth||600,H=148;
  const pad={l:28,r:12,t:13,b:18};
  const xS=i=>pad.l+(i/(data.length-1))*(W-pad.l-pad.r),yS=v=>pad.t+(1-v/10)*(H-pad.t-pad.b);
  [2,4,6,8,10].forEach(v=>{const y=yS(v);svg.innerHTML+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--brd)" stroke-width="1"/><text x="${pad.l-3}" y="${y+4}" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="9" fill="var(--t3)">${v}</text>`});
  svg.innerHTML+=`<polyline points="${data.map((s,i)=>`${xS(i)},${yS(s.score)}`).join(' ')}" fill="none" stroke="var(--pl)" stroke-width="2" stroke-linejoin="round"/>`;
  data.forEach((s,i)=>svg.innerHTML+=`<circle cx="${xS(i)}" cy="${yS(s.score)}" r="4" fill="${CC(s.calificacion)}"/>`);
}
async function clearHist(){if(!confirm(T('ch').replace('🗑 ','')+' — '+T('nc2')+'?'))return;try{await clearS();toast(T('cl'),'inf');renderProg()}catch(e){toast('Error','err')}}
